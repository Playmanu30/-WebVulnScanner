<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'"
    />
    <title>AI Web Vulnerability Scanner</title>
    <style>
      :root {
        color-scheme: light;
        --brand: #5b6ee1;
        --brand-2: #7c3aed;
        --ink: #111827;
        --muted: #6b7280;
        --line: #e5e7eb;
        --bg: #f4f6fb;
        --critical: #dc2626;
        --high: #ea580c;
        --medium: #2563eb;
        --low: #16a34a;
        --info: #64748b;
      }

      * { box-sizing: border-box; }

      html, body, #root { height: 100%; }

      body {
        margin: 0;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        color: var(--ink);
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      }

      .app {
        display: flex;
        gap: 18px;
        height: 100vh;
        padding: 18px;
      }

      /* ---------- Sidebar ---------- */
      .sidebar {
        width: 290px;
        flex: 0 0 290px;
        display: flex;
        flex-direction: column;
        gap: 18px;
        padding: 22px;
        border-radius: 18px;
        background: linear-gradient(160deg, #111827 0%, #1f2937 100%);
        color: #e5e7eb;
        overflow: hidden;
      }

      .brand { display: flex; align-items: center; gap: 12px; }
      .brand-icon {
        width: 44px; height: 44px;
        display: grid; place-items: center;
        border-radius: 12px;
        background: linear-gradient(135deg, var(--brand), var(--brand-2));
        color: #fff;
      }
      .brand-title { font-size: 17px; font-weight: 700; color: #fff; }
      .brand-sub { font-size: 11px; color: #9ca3af; margin-top: 2px; }

      .nav-label {
        font-size: 10px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: #9ca3af;
        margin: 6px 0 8px;
      }

      .scanner-list { display: flex; flex-direction: column; gap: 4px; overflow-y: auto; }

      .scanner-row {
        display: flex; align-items: center; gap: 10px;
        padding: 8px 10px;
        border-radius: 9px;
        font-size: 12.5px;
        color: #d1d5db;
      }
      .scanner-row.is-active { background: rgba(91, 110, 225, 0.22); color: #fff; }
      .scanner-row.is-error { color: #fca5a5; }
      .scanner-name { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .scanner-count {
        font-size: 11px;
        font-variant-numeric: tabular-nums;
        background: rgba(255, 255, 255, 0.12);
        border-radius: 999px;
        padding: 1px 7px;
      }

      .dot { width: 8px; height: 8px; border-radius: 50%; background: #4b5563; flex: 0 0 auto; }
      .dot.active { background: #38bdf8; box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.25); }
      .dot.done { background: #34d399; }
      .dot.error { background: #f87171; }

      .sidebar-footer {
        margin-top: auto;
        padding-top: 14px;
        border-top: 1px solid rgba(255, 255, 255, 0.1);
        font-size: 11px;
        color: #9ca3af;
        display: grid;
        gap: 6px;
      }
      .sidebar-footer b { color: #e5e7eb; font-weight: 600; }

      /* ---------- Main ---------- */
      .main {
        flex: 1;
        min-width: 0;
        border-radius: 18px;
        background: #fff;
        padding: 26px 28px 40px;
        overflow-y: auto;
        box-shadow: 0 18px 40px rgba(15, 23, 42, 0.18);
      }

      .topbar { display: flex; justify-content: space-between; gap: 16px; align-items: flex-start; flex-wrap: wrap; }
      .title { margin: 0; font-size: 24px; letter-spacing: -0.01em; }
      .subtitle { margin: 6px 0 0; font-size: 13px; color: var(--muted); }

      .target-form {
        display: flex;
        gap: 10px;
        margin: 22px 0 0;
        padding: 16px;
        border: 1px solid var(--line);
        border-radius: 14px;
        background: #fafbff;
      }
      .input-wrap { position: relative; flex: 1; min-width: 0; }
      .input-wrap svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: #9ca3af; }
      .url-input {
        width: 100%;
        padding: 12px 12px 12px 40px;
        border: 1px solid #d1d5db;
        border-radius: 10px;
        font-size: 14px;
        background: #fff;
        outline: none;
        transition: border-color 0.15s, box-shadow 0.15s;
      }
      .url-input:focus { border-color: var(--brand); box-shadow: 0 0 0 3px rgba(91, 110, 225, 0.15); }

      .btn {
        display: inline-flex; align-items: center; gap: 8px;
        padding: 11px 16px;
        border: 1px solid transparent;
        border-radius: 10px;
        font-size: 13.5px;
        font-weight: 600;
        cursor: pointer;
        background: #e5e7eb;
        color: #111827;
        transition: filter 0.15s, background 0.15s, transform 0.05s;
        white-space: nowrap;
      }
      .btn:hover:not(:disabled) { filter: brightness(0.97); }
      .btn:active:not(:disabled) { transform: translateY(1px); }
      .btn:disabled { opacity: 0.55; cursor: not-allowed; }
      .btn-primary { background: linear-gradient(135deg, var(--brand), var(--brand-2)); color: #fff; }
      .btn-ghost { background: #fff; border-color: #d1d5db; color: #374151; }
      .btn-danger { background: #fee2e2; color: #b91c1c; }

      .progress { margin-top: 16px; }
      .progress-head { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); margin-bottom: 6px; }
      .progress-track { height: 7px; background: #eef0f7; border-radius: 999px; overflow: hidden; }
      .progress-fill { height: 100%; border-radius: 999px; background: linear-gradient(90deg, var(--brand), var(--brand-2)); transition: width 0.25s ease; }

      .banner {
        display: flex; gap: 10px; align-items: flex-start;
        margin-top: 16px;
        padding: 12px 14px;
        border-radius: 10px;
        font-size: 13px;
        line-height: 1.45;
      }
      .banner.error { background: #fef2f2; color: #991b1b; border: 1px solid #fecaca; }
      .banner.success { background: #f0fdf4; color: #166534; border: 1px solid #bbf7d0; }
      .banner.info { background: #eff6ff; color: #1e40af; border: 1px solid #bfdbfe; }
      .banner svg { flex: 0 0 auto; margin-top: 1px; }

      .section { margin-top: 26px; }
      .section-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 12px; }
      .section-title { margin: 0; font-size: 16px; }
      .muted { color: var(--muted); font-size: 12.5px; }

      .score-row { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; }
      .card {
        border: 1px solid var(--line);
        border-top: 3px solid #d1d5db;
        border-radius: 12px;
        padding: 12px 14px;
        background: #fff;
      }
      .card.critical { border-top-color: var(--critical); }
      .card.high { border-top-color: var(--high); }
      .card.medium { border-top-color: var(--medium); }
      .card.low { border-top-color: var(--low); }
      .card.info { border-top-color: var(--info); }
      .card-label { font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); }
      .card-value { font-size: 24px; font-weight: 700; font-variant-numeric: tabular-nums; margin-top: 4px; }

      .findings { display: flex; flex-direction: column; gap: 10px; }
      .finding {
        border: 1px solid var(--line);
        border-left: 4px solid #d1d5db;
        border-radius: 10px;
        padding: 12px 14px;
        background: #fff;
      }
      .finding.critical { border-left-color: var(--critical); }
      .finding.high { border-left-color: var(--high); }
      .finding.medium { border-left-color: var(--medium); }
      .finding.low { border-left-color: var(--low); }
      .finding.info { border-left-color: var(--info); }

      .finding-head { display: flex; justify-content: space-between; gap: 12px; align-items: center; }
      .finding-title { font-weight: 650; font-size: 13.5px; }
      .finding-meta { font-size: 11.5px; color: var(--muted); margin-top: 3px; }
      .finding-desc { font-size: 13px; color: #374151; margin: 10px 0 0; line-height: 1.5; }

      .sev-badge {
        flex: 0 0 auto;
        font-size: 10.5px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase;
        padding: 3px 9px; border-radius: 999px; color: #fff; background: var(--info);
      }
      .sev-badge.critical { background: var(--critical); }
      .sev-badge.high { background: var(--high); }
      .sev-badge.medium { background: var(--medium); }
      .sev-badge.low { background: var(--low); }
      .sev-badge.info { background: var(--info); }

      .evidence {
        margin: 10px 0 0;
        padding: 9px 11px;
        border-radius: 8px;
        background: #0f172a;
        color: #e2e8f0;
        font-size: 11.5px;
        font-family: Consolas, 'Courier New', monospace;
        white-space: pre-wrap;
        word-break: break-word;
      }

      .rec-list { margin: 10px 0 0; padding-left: 18px; font-size: 12.5px; color: #374151; display: grid; gap: 4px; }

      .expand {
        margin-top: 10px;
        display: inline-flex; align-items: center; gap: 4px;
        background: none; border: none; padding: 0;
        color: var(--brand); font-size: 12px; font-weight: 600; cursor: pointer;
      }

      .empty {
        padding: 40px 16px;
        text-align: center;
        border: 1px dashed #d1d5db;
        border-radius: 12px;
        color: var(--muted);
        font-size: 13px;
        line-height: 1.6;
      }
      .empty strong { color: #111827; display: block; margin-bottom: 6px; font-size: 14px; }
      .empty ul { display: inline-block; text-align: left; margin: 10px 0 0; padding-left: 18px; }

      .insights, .recs-top { display: grid; gap: 8px; }
      .insight, .rec {
        display: flex; gap: 10px; align-items: flex-start;
        padding: 11px 13px;
        border-radius: 10px;
        background: #f8fafc;
        border: 1px solid var(--line);
        font-size: 12.5px;
        line-height: 1.5;
      }
      .insight b { color: #334155; }
      .rec .prio { flex: 0 0 auto; }
      .rec-body { display: grid; gap: 2px; }
      .rec-title { font-weight: 600; font-size: 12px; color: #334155; }

      .toolbar { display: flex; gap: 8px; flex-wrap: wrap; }

      .profile-select {
        padding: 11px 12px;
        border: 1px solid #d1d5db;
        border-radius: 10px;
        background: #fff;
        font-size: 13px;
        color: #374151;
        cursor: pointer;
      }
      .profile-select:focus { outline: none; border-color: var(--brand); box-shadow: 0 0 0 3px rgba(91, 110, 225, 0.15); }

      .gate {
        display: flex;
        gap: 10px;
        align-items: flex-start;
        margin-top: 12px;
        padding: 11px 13px;
        border: 1px solid #fde68a;
        border-radius: 10px;
        background: #fffbeb;
        font-size: 12px;
        line-height: 1.5;
        color: #78350f;
        cursor: pointer;
      }
      .gate.is-checked { border-color: #bbf7d0; background: #f0fdf4; color: #14532d; }
      .gate input { margin-top: 2px; accent-color: #16a34a; }
      .gate b { font-weight: 700; }

      .live { display: grid; gap: 6px; }
      .live-row {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 8px 11px;
        border: 1px solid var(--line);
        border-left: 3px solid #d1d5db;
        border-radius: 8px;
        background: #fff;
        font-size: 12.5px;
      }
      .live-row.critical { border-left-color: var(--critical); }
      .live-row.high { border-left-color: var(--high); }
      .live-row.medium { border-left-color: var(--medium); }
      .live-row.low { border-left-color: var(--low); }
      .live-title { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .live-scanner { flex: 0 0 auto; font-size: 11px; color: var(--muted); }

      .chip {
        display: inline-block;
        margin-right: 6px;
        padding: 2px 8px;
        border-radius: 999px;
        background: #eef2ff;
        color: #4338ca;
        font-size: 10.5px;
        font-weight: 600;
      }

      .playbook {
        margin: 12px 0 4px;
        padding: 12px 14px;
        border: 1px solid #e0e7ff;
        border-left: 3px solid #6366f1;
        border-radius: 8px;
        background: #f8faff;
        font-size: 12.5px;
        line-height: 1.6;
        color: #1f2937;
      }
      .playbook-head {
        display: flex;
        align-items: center;
        gap: 6px;
        margin-bottom: 6px;
        font-weight: 700;
        font-size: 12.5px;
        color: #3730a3;
      }
      .playbook-tag {
        margin-left: auto;
        padding: 1px 7px;
        border-radius: 999px;
        background: #e0e7ff;
        color: #4338ca;
        font-size: 9.5px;
        font-weight: 700;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }
      .playbook-summary { margin: 0 0 8px; color: #374151; }
      .playbook-steps { margin: 0 0 9px; padding-left: 18px; }
      .playbook-steps li { margin-bottom: 6px; }
      .playbook-steps b { color: #111827; }
      .playbook-impact { margin: 0 0 8px; }
      .playbook-limits {
        margin: 0;
        padding: 7px 9px;
        border-radius: 6px;
        background: #fffbeb;
        color: #92400e;
        font-size: 11.5px;
      }

      .auth-toggle {
        display: flex;
        align-items: center;
        gap: 6px;
        width: 100%;
        margin-top: 10px;
        padding: 8px 12px;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: #fff;
        font-size: 12.5px;
        color: #374151;
        cursor: pointer;
        text-align: left;
      }
      .auth-toggle.is-open { border-color: #c7d2fe; background: #f8faff; }
      .auth-hint { margin-left: auto; font-size: 11px; color: var(--muted); }

      .auth-panel {
        margin-top: 8px;
        padding: 12px;
        border: 1px solid #e0e7ff;
        border-radius: 10px;
        background: #fbfcff;
        display: grid;
        gap: 10px;
      }
      .auth-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
      .auth-grid label, .auth-block { display: grid; gap: 4px; font-size: 11.5px; color: #4b5563; }
      .auth-grid input, .auth-block input, .auth-block textarea {
        padding: 8px 10px;
        border: 1px solid #d1d5db;
        border-radius: 8px;
        font-size: 12.5px;
        font-family: inherit;
        background: #fff;
      }
      .auth-block textarea {
        resize: vertical;
        font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
      }
      .auth-blind { display: flex; gap: 8px; align-items: flex-start; font-size: 12px; color: #374151; }
      .auth-note { margin: 0; font-size: 11px; color: var(--muted); }

      .btn-mini {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        padding: 5px 9px;
        border: 1px solid #d1d5db;
        border-radius: 7px;
        background: #fff;
        font-size: 11.5px;
        color: #374151;
        cursor: pointer;
      }
      .btn-mini:hover { border-color: #a5b4fc; color: #3730a3; }
      .finding-tools { display: flex; gap: 8px; margin: 8px 0 4px; }

      .modal-backdrop {
        position: fixed;
        inset: 0;
        z-index: 50;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: rgba(17, 24, 39, 0.55);
      }
      .modal {
        width: min(900px, 100%);
        max-height: 88vh;
        overflow: auto;
        display: grid;
        gap: 10px;
        padding: 18px;
        border-radius: 14px;
        background: #fff;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
      }
      .modal-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
      .modal-title { display: flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 700; }
      .modal-sub { margin-top: 2px; font-size: 11.5px; color: var(--muted); }
      .console-form { display: flex; gap: 8px; }
      .console-form select { padding: 8px; border: 1px solid #d1d5db; border-radius: 8px; background: #fff; }
      .console-url {
        flex: 1;
        min-width: 0;
        padding: 8px 10px;
        border: 1px solid #d1d5db;
        border-radius: 8px;
        font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
        font-size: 12px;
      }
      .console-output { display: grid; gap: 6px; }
      .console-status { font-size: 11.5px; font-weight: 600; color: #374151; }
      .console-body { max-height: 320px; overflow: auto; white-space: pre-wrap; word-break: break-all; }

      .spinner { animation: spin 1s linear infinite; }
      @keyframes spin { to { transform: rotate(360deg); } }

      .scanner-errors { display: grid; gap: 6px; font-size: 12px; color: #991b1b; }
      .scanner-errors code { background: #fef2f2; border-radius: 6px; padding: 6px 8px; }

      @media (max-width: 1180px) {
        .app { flex-direction: column; height: auto; min-height: 100vh; }
        .sidebar { width: auto; flex: 0 0 auto; }
        .scanner-list { flex-direction: row; flex-wrap: wrap; }
        .scanner-row { flex: 0 0 auto; }
        .score-row { grid-template-columns: repeat(3, 1fr); }
      }
      @media (max-width: 720px) {
        .app { padding: 10px; }
        .main { padding: 18px; }
        .score-row { grid-template-columns: repeat(2, 1fr); }
        .target-form { flex-direction: column; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <noscript>This application requires JavaScript.</noscript>
  </body>
</html>
